verification:
  enabled: false
  callback_timeout: "10s"
  database_url: "postgres://localhost:5432/whatsadk?sslmode=disable"  # PostgreSQL for blacklisted numbers
  # devops_numbers:         # E.164 digits (no + prefix) allowed to bypass phone mismatch
