# Configuration for WhatsApp-ADK Gateway Example

whatsapp:
  # Connection string for WhatsApp session storage
  store_dsn: "sqlite-p2p://data/whatsadk_p2p.db?wal=true"
  log_level: "INFO"
  
adk:
  # The endpoint of the ADK agent API server (started by examples/hello/main.go)
  # Note: The adk-go REST server prefixes all app-related routes with /api
  endpoint: "http://localhost:8000/api"
  # The name of the agent defined in examples/hello/main.go
  app_name: "HelloWorkAgent"
  streaming: false

# Global Blacklist / Verification Store using SQLite P2P backend
verification:
  database_url: "sqlite-p2p://data/whatsadk_p2p.db?wal=true"

# SQLite P2P Decentralized Storage & Replication Configuration
p2p:
  enabled: true
  node_id: "hello-gateway-node"
  swarm_topic: "whatsadk-hello"
  db_path: "data/whatsadk_p2p.db"
  enable_wal: true
  auto_sync: true
  replication:
    mode: "all"

# Auth is optional for local development unless testing JWT
# auth:
#   jwt:
#     private_key_path: "secrets/jwt_private.pem"
